<header>
  <h1>StockFlow</h1>
  <button type="button" class="secundario" (click)="carregar()">Atualizar</button>
</header>

<main>
  @if (erro()) {
    <p class="alerta erro">{{ erro() }}</p>
  }

  <section>
    <h2>Produtos</h2>
    <app-produto-lista
      [produtos]="produtos()"
      (editar)="editar($event)"
      (excluir)="excluir($event)" />
  </section>
</main>
